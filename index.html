<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>她为什么总是在摔倒？——两千万分之一的失衡人生</title>
    <style>
        /* ========== 鼠标圆圈效果样式 ========== */
        @import url('https://fonts.googleapis.com/css?family=Poppins:200,300,400,500,600,700,800,900&display=swap');
        
        /* 基础重置（整合原有+鼠标效果的重置） */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "寒蝉手拙体", "Poppins", sans-serif;
            cursor: url("images/shouxing.png") 15 15, auto;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #0c2935;
            overflow-x: hidden;
            cursor: pointer; /* 提示可点击 */
        }

        /* 鼠标点击圆圈样式 */
        .circle {
            position: absolute;
            transform: translate(-50%,-50%);
            border: 2px solid #03a9f4;
            border-radius: 50%;
            z-index: 9999999;
            pointer-events: none;
            animation: animate 1s linear forwards;
        }

        @keyframes animate {
            0% {
                width: 0px;
                height: 0px;
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                width: 100px;
                height: 100px;
                opacity: 0;
            }
        }

        /* ========== 原有全屏视频样式 ========== */
        .fullscreen-video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            z-index: 1;
        }

        .fullscreen-video {
            position: absolute;
            top: -15%;
            left: 0;
            width: 100%;
            height: 130%;
            object-fit: cover;
            z-index: 2;
            border: none;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3;
            background: rgba(0, 0, 0, 0.45);
            text-align: center;
            padding: 20px;
        }

        /* ========== 新增：组件渐入动画 + 默认隐藏 ========== */
        .text-item {
            opacity: 0; /* 初始透明 */
            visibility: hidden; /* 初始不可见（避免点击） */
            transform: translateY(20px); /* 初始下移20px */
            transition: all 0.8s ease-out; /* 渐入动画时长 */
        }
        .text-item.show {
            opacity: 1; /* 显示时不透明 */
            visibility: visible; /* 显示时可交互 */
            transform: translateY(0); /* 回到原位置 */
        }

        /* 标题样式 */
        .video-overlay h1 {
            font-size: 5em;
            color: #fff;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.3;
            text-shadow: 0 2px 15px rgba(0,0,0,0.7);
            max-width: 900px;
        }

        /* 副标题样式 */
        .video-subtitle {
            font-size: 2em;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            text-shadow: 0 1px 8px rgba(0,0,0,0.6);
            letter-spacing: 2px;
        }

        /* 按钮样式 */
        .enter-btn {
            display: inline-block;
            padding: 14px 45px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            font-size: 2em;
            letter-spacing: 3px;
            transition: all 0.4s ease;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            z-index: 4;
            position: relative;
        }

        .enter-btn:hover {
            background: rgba(255,255,255,0.25);
            border-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.85em;
            letter-spacing: 2px;
            /* 滚动提示最后显示 */
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s ease-out 0.3s;
        }
        .scroll-hint.show {
            opacity: 1;
            visibility: visible;
        }

        .scroll-arrow {
            font-size: 1.8em;
            margin-top: 8px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%,20%,50%,80%,100%{transform:translateY(0)}
            40%{transform:translateY(-12px)}
            60%{transform:translateY(-6px)}
        }

        /* 响应式适配 */
        @media (max-width:768px){
            .video-overlay h1{font-size: 2.2em;padding:0 15px}
            .video-subtitle{font-size:1em;margin-bottom:30px}
            .enter-btn{padding:12px 35px;font-size:1em}
        }
        @media (max-width:480px){
            .video-overlay h1{font-size: 1.8em}
            .video-subtitle{font-size:.9em}
            .enter-btn{padding:10px 28px;font-size:.9em}
            @keyframes animate {
                0% {width: 0px;height: 0px;opacity: 1;}
                50% {opacity: 1;}
                100% {width: 60px;height: 60px;opacity: 0;}
            }
        }

        .video-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
        }
    </style>
</head>
<body>
    <!-- 全屏视频容器 -->
    <div class="fullscreen-video-container">
        <img class="video-poster" src="video-poster.jpg" alt="视频封面">
        <iframe 
            id="hero-video"
            class="fullscreen-video"
            src="https://www.bilibili.com/blackboard/html5mobileplayer.html?bvid=BV1UBNfeSEnV&t=36.6&autoplay=1&muted=1&danmaku=0&hideCoverInfo=1&noFullScreenButton=1"
            frameborder="0"
            scrolling="no"
            allow="autoplay; encrypted-media"
            sandbox="allow-same-origin allow-scripts allow-autoplay"
        ></iframe>

        <div class="video-overlay">
            <!-- 给每个组件加 text-item 类（默认隐藏） -->
            <h1 id="p0" class="text-item">她为什么总是在摔倒？<br>&nbsp;&nbsp;&nbsp;——两千万分之一的失衡人生</h1>
            <p class="video-subtitle text-item">走进电影——《一公升的眼泪》</p>
            <a href="yinru.html" class="enter-btn text-item">进入阅读</a>
        </div>
        
        <audio autoplay loop preload="auto" src="images/bgm.MP3">

        <div class="scroll-hint" id="scrollHint">
            <span>向下滚动</span>
            <div class="scroll-arrow">↓</div>
        </div>
    </div>

    <script>
        // ========== 鼠标圆圈效果 ==========
        document.addEventListener('click', function(e) {
            const circle = document.createElement('div');
            circle.classList.add('circle');
            circle.style.left = e.clientX + 'px';
            circle.style.top = e.clientY + 'px';
            document.body.appendChild(circle);
            setTimeout(() => circle.remove(), 1000);
        });

        // ========== 点击依次显示组件 ==========
        // 1. 获取所有要显示的组件（按显示顺序排列）
        const items = [
            document.querySelector('#p0'),       // 标题
            document.querySelector('.video-subtitle'), // 副标题
            document.querySelector('.enter-btn'),      // 按钮
            document.querySelector('#scrollHint')      // 滚动提示
        ];
        let clickCount = 0; // 记录点击次数

        // 2. 监听屏幕点击事件
        document.addEventListener('click', function() {
            // 如果还有未显示的组件
            if (clickCount < items.length) {
                items[clickCount].classList.add('show'); // 显示当前组件
                clickCount++; // 点击次数+1
            } else {
                // 所有组件显示完后，点击重置（可选）
                clickCount = 0;
                items.forEach(item => item.classList.remove('show'));
                // 延迟重置滚动提示（避免闪屏）
                setTimeout(() => items[3].classList.remove('show'), 100);
            }
        });

        // 视频循环 + 加载后淡出封面
        const iframe = document.getElementById('hero-video');
        const poster = document.querySelector('.video-poster');
        iframe.onload = () => {
            setTimeout(() => {
                poster.style.transition = 'opacity 0.8s ease';
                poster.style.opacity = '0';
            }, 500);
        };
        iframe.addEventListener('ended', () => {
            iframe.src = iframe.src;
        });
    </script>
</body>
</html>
